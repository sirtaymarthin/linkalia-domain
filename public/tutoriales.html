<style>
:root{--ink:#150B10;--ink-2:#1F1017;--paper:#F6EEF1;--brand:#C22A5F;--brand-mid:#DC7A9C;--brand-light:#EFB5C9;--line:rgba(246,238,241,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;min-height:100vh}
a{color:inherit}
.lang-switch{position:fixed;top:1.25rem;right:1.25rem;z-index:3;display:flex;gap:.4rem;background:rgba(21,11,16,.7);border:1px solid var(--line);border-radius:999px;padding:.3rem;backdrop-filter:blur(6px)}
.lang-switch a{font-size:.82rem;font-weight:500;color:rgba(246,238,241,.55);border-radius:999px;padding:.35rem .8rem;text-decoration:none}
.lang-switch a.active{background:var(--brand);color:var(--paper)}
.back{position:fixed;top:1.25rem;left:1.25rem;z-index:3;font-size:.85rem;color:rgba(246,238,241,.7);text-decoration:none;background:rgba(21,11,16,.7);border:1px solid var(--line);border-radius:999px;padding:.45rem .9rem}
header{text-align:center;padding:5.5rem 6vw 1rem}
h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(2rem,5vw,3.2rem);line-height:1.1}
h1 .accent{color:var(--brand-light);font-style:italic}
.lede{margin:1rem auto 0;max-width:46ch;font-size:1.05rem;line-height:1.6;color:rgba(246,238,241,.75)}
main{max-width:1100px;margin:0 auto;padding:1rem 5vw 3rem}
h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.45rem;margin:2.4rem 0 1rem;color:var(--brand-light)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.1rem}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--brand-mid);outline:none}
.card img{display:block;width:100%;height:auto;aspect-ratio:8/5;object-fit:cover}
.card .t{padding:.85rem 1rem .2rem;font-weight:600;font-size:1rem}
.card .d{padding:0 1rem 1rem;font-size:.86rem;line-height:1.5;color:rgba(246,238,241,.65)}
.player{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(10,5,8,.88);padding:1rem}
.player.open{display:flex}
.player .box{display:flex;flex-direction:column;align-items:center;gap:.8rem;max-height:100%}
.player video{max-height:calc(100vh - 7rem);max-width:100%;border-radius:18px;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.player .cap{font-weight:600;text-align:center}
.player .close{position:absolute;top:1rem;right:1rem;background:var(--brand);color:var(--paper);border:0;border-radius:999px;padding:.5rem 1rem;font:inherit;font-size:.85rem;cursor:pointer}
.player .toggles{display:flex;gap:.5rem}
.player .tg{background:transparent;color:var(--paper);border:2px solid var(--paper);border-radius:8px;padding:.3rem .8rem;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer;text-decoration:line-through;opacity:.75}
.player .tg[aria-pressed="true"]{background:var(--paper);color:var(--ink);text-decoration:none;opacity:1}
footer{text-align:center;padding:1.5rem 1rem 2rem;font-size:.82rem;color:rgba(246,238,241,.4)}
footer a{opacity:.7;text-underline-offset:3px}
</style>

<body>
<a class="back" href="/">← Inicio</a>
<nav class="lang-switch" aria-label="Idioma / Language">

<header><h1>Aprende Linkalia <span class="accent">en vídeo</span></h1><p class="lede">Vídeos cortos, de menos de un minuto. Los mismos que encontrarás dentro de la app, en Ajustes → Tutoriales.</p></header>
<main><h2>1 · Guardar desde otras apps</h2><div class="grid"><button class="card" onclick="play(this)" data-id="09_whatsapp" data-src="/tutoriales/es/09_whatsapp.mp4" data-poster="/tutoriales/es/09_whatsapp.jpg" data-vtt="/tutoriales/es/09_whatsapp.vtt" data-vtt-label="Castellano" data-title="Guardar desde WhatsApp"><img src="/tutoriales/es/09_whatsapp.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Guardar desde WhatsApp</div><div class="d">Mantén pulsada la foto o el documento → ⋮ → Compartir → Linkalia. Elige la colección y la categoría y pulsa Guardar aquí.</div></button><button class="card" onclick="play(this)" data-id="10_enlaces" data-src="/tutoriales/es/10_enlaces.mp4" data-poster="/tutoriales/es/10_enlaces.jpg" data-vtt="/tutoriales/es/10_enlaces.vtt" data-vtt-label="Castellano" data-title="Enlaces de YouTube e Instagram"><img src="/tutoriales/es/10_enlaces.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Enlaces de YouTube e Instagram</div><div class="d">Copia el enlace (en WhatsApp: mantenlo pulsado → ⋮ → Copiar) y en Linkalia pulsa + → Añadir enlace: el teclado te ofrece pegarlo. El título y la imagen salen solos.</div></button><button class="card" onclick="play(this)" data-id="11_archivos" data-src="/tutoriales/es/11_archivos.mp4" data-poster="/tutoriales/es/11_archivos.jpg" data-vtt="/tutoriales/es/11_archivos.vtt" data-vtt-label="Castellano" data-title="Guardar ficheros desde Archivos"><img src="/tutoriales/es/11_archivos.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Guardar ficheros desde Archivos</div><div class="d">En Archivos mantén pulsado el fichero → Compartir → Linkalia. Elige la categoría y pulsa Guardar aquí.</div></button></div><h2>2 · Primeros pasos</h2><div class="grid"><button class="card" onclick="play(this)" data-id="01_crear_coleccion" data-src="/tutoriales/es/01_crear_coleccion.mp4" data-poster="/tutoriales/es/01_crear_coleccion.jpg" data-vtt="/tutoriales/es/01_crear_coleccion.vtt" data-vtt-label="Castellano" data-title="Crear una colección"><img src="/tutoriales/es/01_crear_coleccion.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Crear una colección</div><div class="d">Toca la carpeta con + de la biblioteca, pon un nombre, elige un icono y pulsa Crear. Nace privada y con sus categorías.</div></button><button class="card" onclick="play(this)" data-id="02_categorias" data-src="/tutoriales/es/02_categorias.mp4" data-poster="/tutoriales/es/02_categorias.jpg" data-vtt="/tutoriales/es/02_categorias.vtt" data-vtt-label="Castellano" data-title="Crear una categoría"><img src="/tutoriales/es/02_categorias.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Crear una categoría</div><div class="d">Dentro de una colección: + → Nueva categoría. Elige nombre e icono; para editarla o borrarla, usa su menú ⋮.</div></button><button class="card" onclick="play(this)" data-id="03_anadir_enlace" data-src="/tutoriales/es/03_anadir_enlace.mp4" data-poster="/tutoriales/es/03_anadir_enlace.jpg" data-vtt="/tutoriales/es/03_anadir_enlace.vtt" data-vtt-label="Castellano" data-title="Añadir un enlace"><img src="/tutoriales/es/03_anadir_enlace.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Añadir un enlace</div><div class="d">+ → Añadir enlace, pega la dirección y elige la categoría. El título y la imagen aparecen solos.</div></button><button class="card" onclick="play(this)" data-id="04_info_coleccion" data-src="/tutoriales/es/04_info_coleccion.mp4" data-poster="/tutoriales/es/04_info_coleccion.jpg" data-vtt="/tutoriales/es/04_info_coleccion.vtt" data-vtt-label="Castellano" data-title="Info de la colección"><img src="/tutoriales/es/04_info_coleccion.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Info de la colección</div><div class="d">Toca el icono o el título de la colección: ahí están el acceso, editar, vaciar y eliminar.</div></button></div><h2>3 · Personalizar</h2><div class="grid"><button class="card" onclick="play(this)" data-id="06_icono_coleccion" data-src="/tutoriales/es/06_icono_coleccion.mp4" data-poster="/tutoriales/es/06_icono_coleccion.jpg" data-vtt="/tutoriales/es/06_icono_coleccion.vtt" data-vtt-label="Castellano" data-title="Elegir el icono o emoji"><img src="/tutoriales/es/06_icono_coleccion.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Elegir el icono o emoji</div><div class="d">Info de la colección → Editar: cambia el nombre y elige un icono, un emoji o una imagen.</div></button><button class="card" onclick="play(this)" data-id="07_nombre_foto" data-src="/tutoriales/es/07_nombre_foto.mp4" data-poster="/tutoriales/es/07_nombre_foto.jpg" data-vtt="/tutoriales/es/07_nombre_foto.vtt" data-vtt-label="Castellano" data-title="Tu nombre y tu foto"><img src="/tutoriales/es/07_nombre_foto.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Tu nombre y tu foto</div><div class="d">Ajustes → toca tu nombre: cámbialo y elige una foto. Es lo que ven los demás en lo que compartes.</div></button></div><h2>4 · Compartir</h2><div class="grid"><button class="card" onclick="play(this)" data-id="05_tipo_coleccion" data-src="/tutoriales/es/05_tipo_coleccion.mp4" data-poster="/tutoriales/es/05_tipo_coleccion.jpg" data-vtt="/tutoriales/es/05_tipo_coleccion.vtt" data-vtt-label="Castellano" data-title="Cambiar el tipo de colección"><img src="/tutoriales/es/05_tipo_coleccion.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Cambiar el tipo de colección</div><div class="d">En Info de la colección, elige el acceso: Privada, Solo ver o Ver y editar. Después invita con el enlace o el QR.</div></button><button class="card" onclick="play(this)" data-id="08_compartir_html" data-src="/tutoriales/es/08_compartir_html.mp4" data-poster="/tutoriales/es/08_compartir_html.jpg" data-vtt="/tutoriales/es/08_compartir_html.vtt" data-vtt-label="Castellano" data-title="Compartir como HTML"><img src="/tutoriales/es/08_compartir_html.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Compartir como HTML</div><div class="d">Menú ⋮ de la colección → Compartir como HTML. Quien lo recibe lo abre en el navegador, sin la app.</div></button></div></main>
<div class="player" id="player" role="dialog" aria-modal="true">
  <button type="button" class="close" onclick="stop()">Cerrar</button>
  <div class="box"><video controls playsinline preload="none"></video><div class="cap"></div>
    <div class="toggles"><button type="button" class="tg" id="tg-voice" aria-pressed="true">Voz</button><button type="button" class="tg" id="tg-subs" aria-pressed="true">Subtítulos</button></div></div>
</div>
<footer>Linkalia &nbsp;·&nbsp; <a href="/privacidad">Política de privacidad</a></footer>
<script>
var p=document.getElementById('player'),v=p.querySelector('video'),c=p.querySelector('.cap'),
    bv=document.getElementById('tg-voice'),bs=document.getElementById('tg-subs');
// Voz y subtítulos: opcionales, activados de entrada; la elección se recuerda en este navegador.
function pref(k){try{return localStorage.getItem('linkalia-tut-'+k)!=='0';}catch(e){return true;}}
function save(k,on){try{localStorage.setItem('linkalia-tut-'+k,on?'1':'0');}catch(e){}}
var voice=pref('voice'),subs=pref('subs');
function apply(){v.muted=!voice;bv.setAttribute('aria-pressed',voice);bs.setAttribute('aria-pressed',subs);
  if(v.textTracks[0])v.textTracks[0].mode=subs?'showing':'hidden';}
bv.onclick=function(){voice=!voice;save('voice',voice);apply();};
bs.onclick=function(){subs=!subs;save('subs',subs);apply();};
// Si se silencia con los controles del propio vídeo, el botón Voz lo refleja.
v.addEventListener('volumechange',function(){if(v.muted===voice){voice=!v.muted;save('voice',voice);apply();}});
function play(b){v.src=b.dataset.src;v.poster=b.dataset.poster;c.textContent=b.dataset.title;
  [].slice.call(v.querySelectorAll('track')).forEach(function(t){t.remove();});
  bs.hidden=!b.dataset.vtt;
  if(b.dataset.vtt){var t=document.createElement('track');t.kind='subtitles';t.srclang=document.documentElement.lang;
    t.label=b.dataset.vttLabel;t.src=b.dataset.vtt;t.default=true;v.appendChild(t);
    t.addEventListener('load',apply);}
  apply();p.classList.add('open');v.play();
  if(window.gtag)gtag('event','tutorial_play',{video:b.dataset.id});}
function stop(){v.pause();v.removeAttribute('src');v.load();p.classList.remove('open');}
p.addEventListener('click',function(e){if(e.target===p)stop();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')stop();});
</script>
</body>
