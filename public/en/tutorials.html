<style>
:root{--ink:#150B10;--ink-2:#1F1017;--paper:#F6EEF1;--brand:#C22A5F;--brand-mid:#DC7A9C;--brand-light:#EFB5C9;--line:rgba(246,238,241,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;min-height:100vh}
a{color:inherit}
.lang-switch{position:fixed;top:1.25rem;right:1.25rem;z-index:3;display:flex;gap:.4rem;background:rgba(21,11,16,.7);border:1px solid var(--line);border-radius:999px;padding:.3rem;backdrop-filter:blur(6px)}
.lang-switch a{font-size:.82rem;font-weight:500;color:rgba(246,238,241,.55);border-radius:999px;padding:.35rem .8rem;text-decoration:none}
.lang-switch a.active{background:var(--brand);color:var(--paper)}
.back{position:fixed;top:1.25rem;left:1.25rem;z-index:3;font-size:.85rem;color:rgba(246,238,241,.7);text-decoration:none;background:rgba(21,11,16,.7);border:1px solid var(--line);border-radius:999px;padding:.45rem .9rem}
header{text-align:center;padding:5.5rem 6vw 1rem}
h1{font-family:'Fraunces',serif;font-weight:500;font-size:clamp(2rem,5vw,3.2rem);line-height:1.1}
h1 .accent{color:var(--brand-light);font-style:italic}
.lede{margin:1rem auto 0;max-width:46ch;font-size:1.05rem;line-height:1.6;color:rgba(246,238,241,.75)}
main{max-width:1100px;margin:0 auto;padding:1rem 5vw 3rem}
h2{font-family:'Fraunces',serif;font-weight:500;font-size:1.45rem;margin:2.4rem 0 1rem;color:var(--brand-light)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.1rem}
.card{background:var(--ink-2);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:transform .15s,border-color .15s}
.card:hover,.card:focus-visible{transform:translateY(-2px);border-color:var(--brand-mid);outline:none}
.card img{display:block;width:100%;height:auto;aspect-ratio:8/5;object-fit:cover}
.card .t{padding:.85rem 1rem .2rem;font-weight:600;font-size:1rem}
.card .d{padding:0 1rem 1rem;font-size:.86rem;line-height:1.5;color:rgba(246,238,241,.65)}
.player{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;background:rgba(10,5,8,.88);padding:1rem}
.player.open{display:flex}
.player .box{display:flex;flex-direction:column;align-items:center;gap:.8rem;max-height:100%}
.player video{max-height:calc(100vh - 7rem);max-width:100%;border-radius:18px;background:#000;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.player .cap{font-weight:600;text-align:center}
.player .close{position:absolute;top:1rem;right:1rem;background:var(--brand);color:var(--paper);border:0;border-radius:999px;padding:.5rem 1rem;font:inherit;font-size:.85rem;cursor:pointer}
.player .toggles{display:flex;gap:.5rem}
.player .tg{display:inline-flex;align-items:center;justify-content:center;min-width:3.6rem;min-height:3rem;background:transparent;color:var(--paper);border:2px solid var(--paper);border-radius:12px;padding:0 .9rem;font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer;text-decoration:line-through;opacity:.75}
.player .tg[aria-pressed="true"]{background:var(--paper);color:var(--ink);text-decoration:none;opacity:1}
.player .tg svg{width:1.8rem;height:1.8rem;fill:currentColor}
/* Altavoz: con sonido si está activado, tachado si no. */
.player #tg-voice .off,.player #tg-voice[aria-pressed="true"] .on{display:block}
.player #tg-voice .on,.player #tg-voice[aria-pressed="true"] .off{display:none}
footer{text-align:center;padding:1.5rem 1rem 2rem;font-size:.82rem;color:rgba(246,238,241,.4)}
footer a{opacity:.7;text-underline-offset:3px}
</style>

<body>

<header><h1>Learn Linkalia <span class="accent">on video</span></h1><p class="lede">Short videos, under a minute each. The same ones you will find inside the app, in Settings → Tutorials.</p></header>
<main><h2>1 · Save from other apps</h2><div class="grid"><button class="card" onclick="play(this)" data-id="09_whatsapp" data-src="/tutoriales/en/09_whatsapp.mp4" data-poster="/tutoriales/en/09_whatsapp.jpg" data-vtt="/tutoriales/en/09_whatsapp.vtt" data-vtt-label="English" data-title="Save from WhatsApp"><img src="/tutoriales/en/09_whatsapp.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Save from WhatsApp</div><div class="d">Long-press the photo or document → ⋮ → Share → Linkalia. Pick the collection and category and tap Save here.</div></button><button class="card" onclick="play(this)" data-id="10_enlaces" data-src="/tutoriales/en/10_enlaces.mp4" data-poster="/tutoriales/en/10_enlaces.jpg" data-vtt="/tutoriales/en/10_enlaces.vtt" data-vtt-label="English" data-title="YouTube and Instagram links"><img src="/tutoriales/en/10_enlaces.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">YouTube and Instagram links</div><div class="d">Copy the link (in WhatsApp: long-press it → ⋮ → Copy), then in Linkalia tap + → Add link: the keyboard offers to paste it. The title and image appear on their own.</div></button><button class="card" onclick="play(this)" data-id="11_archivos" data-src="/tutoriales/en/11_archivos.mp4" data-poster="/tutoriales/en/11_archivos.jpg" data-vtt="/tutoriales/en/11_archivos.vtt" data-vtt-label="English" data-title="Save files from Files"><img src="/tutoriales/en/11_archivos.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Save files from Files</div><div class="d">In Files, long-press the file → Share → Linkalia. Pick the category and tap Save here.</div></button></div><h2>2 · First steps</h2><div class="grid"><button class="card" onclick="play(this)" data-id="01_crear_coleccion" data-src="/tutoriales/en/01_crear_coleccion.mp4" data-poster="/tutoriales/en/01_crear_coleccion.jpg" data-vtt="/tutoriales/en/01_crear_coleccion.vtt" data-vtt-label="English" data-title="Create a collection"><img src="/tutoriales/en/01_crear_coleccion.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Create a collection</div><div class="d">Tap the folder with + in the library, type a name, pick an icon and tap Create. It starts private, with its categories.</div></button><button class="card" onclick="play(this)" data-id="02_categorias" data-src="/tutoriales/en/02_categorias.mp4" data-poster="/tutoriales/en/02_categorias.jpg" data-vtt="/tutoriales/en/02_categorias.vtt" data-vtt-label="English" data-title="Create a category"><img src="/tutoriales/en/02_categorias.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Create a category</div><div class="d">Inside a collection: + → New category. Pick a name and an icon; to edit or delete it, use its ⋮ menu.</div></button><button class="card" onclick="play(this)" data-id="03_anadir_enlace" data-src="/tutoriales/en/03_anadir_enlace.mp4" data-poster="/tutoriales/en/03_anadir_enlace.jpg" data-vtt="/tutoriales/en/03_anadir_enlace.vtt" data-vtt-label="English" data-title="Add a link"><img src="/tutoriales/en/03_anadir_enlace.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Add a link</div><div class="d">+ → Add link, paste the address and pick the category. The title and image appear on their own.</div></button><button class="card" onclick="play(this)" data-id="04_info_coleccion" data-src="/tutoriales/en/04_info_coleccion.mp4" data-poster="/tutoriales/en/04_info_coleccion.jpg" data-vtt="/tutoriales/en/04_info_coleccion.vtt" data-vtt-label="English" data-title="Collection info"><img src="/tutoriales/en/04_info_coleccion.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Collection info</div><div class="d">Tap the collection&#x27;s icon or title: access, edit, empty and delete are there.</div></button></div><h2>3 · Personalise</h2><div class="grid"><button class="card" onclick="play(this)" data-id="06_icono_coleccion" data-src="/tutoriales/en/06_icono_coleccion.mp4" data-poster="/tutoriales/en/06_icono_coleccion.jpg" data-vtt="/tutoriales/en/06_icono_coleccion.vtt" data-vtt-label="English" data-title="Choose the icon or emoji"><img src="/tutoriales/en/06_icono_coleccion.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Choose the icon or emoji</div><div class="d">Collection info → Edit: change the name and pick an icon, an emoji or an image.</div></button><button class="card" onclick="play(this)" data-id="07_nombre_foto" data-src="/tutoriales/en/07_nombre_foto.mp4" data-poster="/tutoriales/en/07_nombre_foto.jpg" data-vtt="/tutoriales/en/07_nombre_foto.vtt" data-vtt-label="English" data-title="Your name and photo"><img src="/tutoriales/en/07_nombre_foto.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Your name and photo</div><div class="d">Settings → tap your name: change it and pick a photo. It is what others see in what you share.</div></button></div><h2>4 · Share</h2><div class="grid"><button class="card" onclick="play(this)" data-id="05_tipo_coleccion" data-src="/tutoriales/en/05_tipo_coleccion.mp4" data-poster="/tutoriales/en/05_tipo_coleccion.jpg" data-vtt="/tutoriales/en/05_tipo_coleccion.vtt" data-vtt-label="English" data-title="Change the collection type"><img src="/tutoriales/en/05_tipo_coleccion.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Change the collection type</div><div class="d">In Collection info, pick the access: Private, View only or View and edit. Then invite with the link or the QR code.</div></button><button class="card" onclick="play(this)" data-id="08_compartir_html" data-src="/tutoriales/en/08_compartir_html.mp4" data-poster="/tutoriales/en/08_compartir_html.jpg" data-vtt="/tutoriales/en/08_compartir_html.vtt" data-vtt-label="English" data-title="Share as HTML"><img src="/tutoriales/en/08_compartir_html.jpg" alt="" loading="lazy" width="800" height="500"><div class="t">Share as HTML</div><div class="d">Collection ⋮ menu → Share as HTML. Whoever gets it opens it in the browser, without the app.</div></button></div></main>
<div class="player" id="player" role="dialog" aria-modal="true">
  <button type="button" class="close" onclick="stop()">Close</button>
  <div class="box"><video controls playsinline preload="none"></video><div class="cap"></div>
    <div class="toggles"><button type="button" class="tg" id="tg-voice" aria-pressed="true" aria-label="Voice" title="Voice"><svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg><svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg></button><button type="button" class="tg" id="tg-subs" aria-pressed="true" aria-label="Subtitles" title="Subtitles">CC</button></div></div>
</div>
<footer>Linkalia &nbsp;·&nbsp; <a href="/en/privacy">Privacy Policy</a></footer>
<script>
var p=document.getElementById('player'),v=p.querySelector('video'),c=p.querySelector('.cap'),
    bv=document.getElementById('tg-voice'),bs=document.getElementById('tg-subs');
// Voz y subtítulos: opcionales, activados de entrada; la elección se recuerda en este navegador.
function pref(k){try{return localStorage.getItem('linkalia-tut-'+k)!=='0';}catch(e){return true;}}
function save(k,on){try{localStorage.setItem('linkalia-tut-'+k,on?'1':'0');}catch(e){}}
var voice=pref('voice'),subs=pref('subs');
function apply(){v.muted=!voice;bv.setAttribute('aria-pressed',voice);bs.setAttribute('aria-pressed',subs);
  if(v.textTracks[0])v.textTracks[0].mode=subs?'showing':'hidden';}
bv.onclick=function(){voice=!voice;save('voice',voice);apply();};
bs.onclick=function(){subs=!subs;save('subs',subs);apply();};
// Si se silencia con los controles del propio vídeo, el botón Voz lo refleja.
v.addEventListener('volumechange',function(){if(v.muted===voice){voice=!v.muted;save('voice',voice);apply();}});
function play(b){v.src=b.dataset.src;v.poster=b.dataset.poster;c.textContent=b.dataset.title;
  [].slice.call(v.querySelectorAll('track')).forEach(function(t){t.remove();});
  bs.hidden=!b.dataset.vtt;
  if(b.dataset.vtt){var t=document.createElement('track');t.kind='subtitles';t.srclang=document.documentElement.lang;
    t.label=b.dataset.vttLabel;t.src=b.dataset.vtt;t.default=true;v.appendChild(t);
    t.addEventListener('load',apply);}
  apply();p.classList.add('open');v.play();
  if(window.gtag)gtag('event','tutorial_play',{video:b.dataset.id});}
function stop(){v.pause();v.removeAttribute('src');v.load();p.classList.remove('open');}
p.addEventListener('click',function(e){if(e.target===p)stop();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')stop();});
</script>
