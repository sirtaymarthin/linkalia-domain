name = "linkalia-domain"
compatibility_date = "2026-01-01"
main = "src/index.js"

# Antes de [assets]: en TOML, lo que va después de una sección pertenece a ella.
routes = [
    { pattern = "linkalia.org", custom_domain = true },
    { pattern = "www.linkalia.org", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
# Solo pasan por el Worker la portada (inglés o español según el navegador),
# los vídeos (tutoriales y /video/*: respuestas parciales para Safari) y /play-status
# (¿está ya la app en Google Play?).
run_worker_first = ["/", "/index.html", "/tutoriales/*", "/video/*", "/play-status"]
