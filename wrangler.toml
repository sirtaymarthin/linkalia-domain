name = "linkalia-domain"
compatibility_date = "2026-01-01"
main = "src/index.js"

[assets]
directory = "./public"
binding = "ASSETS"
# Solo pasan por el Worker los vídeos tutoriales (respuestas parciales para
# Safari) y /play-status (¿está ya la app en Google Play?).
run_worker_first = ["/tutoriales/*", "/play-status"]

routes = [
    { pattern = "linkalia.org", custom_domain = true },
    { pattern = "www.linkalia.org", custom_domain = true }
]
