name = "linkalia-domain"
compatibility_date = "2026-01-01"
main = "src/index.js"

[assets]
directory = "./public"
binding = "ASSETS"
# Solo pasan por el Worker la portada (inglés o español según el navegador),
# los vídeos tutoriales (respuestas parciales para Safari) y /play-status
# (¿está ya la app en Google Play?).
run_worker_first = ["/", "/index.html", "/tutoriales/*", "/play-status"]

routes = [
    { pattern = "linkalia.org", custom_domain = true },
    { pattern = "www.linkalia.org", custom_domain = true }
]
